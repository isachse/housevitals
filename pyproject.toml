[project]
name = "housevitals"
version = "0.1.0"
description = "HouseVitals: live values, history and charts of heat pumps and PV inverters (Modbus TCP) for MCP, REST and Prometheus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "pymodbus>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "matplotlib>=3.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
housevitals-mcp = "housevitals.server:main"
housevitals = "housevitals.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/housevitals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
